events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    # Custom access log format showing client IP, request, status, and which backend answered
    log_format loadbalancer '$remote_addr - $remote_user [$time_local] "$request" '
                            'status=$status upstream=$upstream_addr '
                            'upstream_response_time=$upstream_response_time '
                            'request_time=$request_time';

    access_log /var/log/nginx/access.log loadbalancer;
    error_log  /var/log/nginx/error.log warn;

    # ─── Upstream Backend Cluster (Round-Robin Load Balancing) ────────────────
    # Nginx distributes incoming requests evenly across backend1, backend2, backend3
    upstream backend_cluster {
        server backend1:5000 max_fails=3 fail_timeout=10s;
        server backend2:5000 max_fails=3 fail_timeout=10s;
        server backend3:5000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Forward all requests to the upstream backend cluster
        location / {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;

            # Forward standard client headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Timeouts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # Automatic failover: if one backend fails/times out, immediately retry next backend
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 10s;
        }

        # Nginx status / health check endpoint
        location /nginx-health {
            access_log off;
            return 200 '{"status":"healthy","service":"nginx-load-balancer"}\n';
        }
    }
}
