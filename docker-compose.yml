# ─── TaskFlow 3-Tier Multi-Instance Docker Compose ────────────────────────────
# BACSE344 — Cloud Infrastructure and Architecture | Assignment Part (a)
# 3 Backend Express instances load-balanced via Nginx reverse proxy

services:
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend-1
    hostname: backend1
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-taskflow_super_secret_jwt_key_2026}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - taskflow-net

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend-2
    hostname: backend2
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-taskflow_super_secret_jwt_key_2026}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - taskflow-net

  backend3:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend-3
    hostname: backend3
    restart: unless-stopped
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET:-taskflow_super_secret_jwt_key_2026}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - taskflow-net

  nginx:
    image: nginx:alpine
    container_name: taskflow-nginx-lb
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend1:
        condition: service_healthy
      backend2:
        condition: service_healthy
      backend3:
        condition: service_healthy
    networks:
      - taskflow-net

networks:
  taskflow-net:
    driver: bridge
